<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mirage Playground</title>
<link rel="stylesheet" href="/static/mirage-client.css?v=2">
</head><body>
<!-- audio capture (AudioWorklet, ScriptProcessor fallback), reconnect and video live in /static/mirage-client.js -->
<h2>Mirage voice playground</h2>
<div class="row"><input id="key" placeholder="API key (mk_...)" autocomplete="off"></div>
<div class="row"><input id="cid" placeholder="Conversation id (c_...)" autocomplete="off"></div>
<div id="mirage"></div>
<script src="/static/mirage-client.js?v=2"></script>
<script src="/static/mirage-ui.js?v=2"></script>
<script>
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
let stored='';try{stored=localStorage.mk||''}catch(e){}
// The key is never put in a WebSocket URL: every (re)connect trades it (sent in a header) for a single-use ticket.
// A dashboard that embeds this page hands the key over with postMessage instead of a ?api_key= URL (which would sit in history/logs).
const q=new URLSearchParams(location.search);
$('key').value=q.get('api_key')||stored; $('cid').value=q.get('cid')||'';
if(q.has('api_key')){try{history.replaceState(null,'',location.pathname+'?cid='+encodeURIComponent($('cid').value))}catch(e){}}
if(window.parent!==window){
  addEventListener('message',e=>{ if(e.source===window.parent&&e.data&&e.data.type==='mirage-key'&&typeof e.data.key==='string'){$('key').value=e.data.key} });
  try{window.parent.postMessage({type:'mirage-playground-ready'},'*')}catch(e){}  // carries no secret
}
const proto=location.protocol==='https:'?'wss':'ws';
const client=new MirageClient({
  wsUrl:async()=>{
    const r=await fetch('/v1/realtime/ticket',{method:'POST',headers:{'x-api-key':$('key').value,'content-type':'application/json'},body:JSON.stringify({conversation_id:$('cid').value})});
    if(!r.ok){const x=new Error(r.status===401?'This API key is not valid.':r.status===404?'Conversation not found for this key.':'Could not get a connection ticket ('+r.status+')');x.userMessage=x.message;throw x}
    return `${proto}://${location.host}${(await r.json()).ws_path}`;
  },
  prepare:async()=>{try{localStorage.mk=$('key').value}catch(e){}}
});
window.__client=client;
MirageUI.mount($('mirage'),client,{mode:'playground',startLabel:'Start',linkButton:'Copy guest link',
  getLink:async()=>{
    const h={'x-api-key':$('key').value,'content-type':'application/json'};
    const c=await fetch('/v1/conversations',{headers:h});
    const row=c.ok?(await c.json()).find(x=>x.id===$('cid').value):null;
    if(!row)throw new Error('Could not read this conversation (check the API key and id)');
    const pid=row.persona_id;
    const r=await fetch('/v1/personas/'+encodeURIComponent(pid)+'/share',{method:'POST',headers:h,body:JSON.stringify({label:'playground',max_seconds:300,expires_in_hours:168})});
    if(!r.ok)throw new Error('Could not create a guest link ('+r.status+')');
    return (await r.json()).url;
  }});
</script></body></html>
